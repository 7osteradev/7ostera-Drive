<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>7ostera Drive</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .topbar { height: 56px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 12px; padding: 0 16px; flex-shrink: 0; z-index: 50; }
    .topbar-logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; width: 220px; flex-shrink: 0; }
    .topbar-search { flex: 1; position: relative; max-width: 480px; }
    .topbar-search input { width: 100%; padding: 7px 12px 7px 34px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); color: var(--text); font-size: 13px; outline: none; transition: all var(--transition); }
    .topbar-search input:focus { background: var(--surface); border-color: var(--border-hover); box-shadow: 0 0 0 3px var(--accent-light); }
    .topbar-search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-3); color: var(--text); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; cursor: pointer; transition: border-color var(--transition); }
    .avatar:hover { border-color: var(--border-hover); }

    .layout { display: flex; flex: 1; overflow: hidden; }

    .sidebar { width: 220px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; padding: 12px 8px; gap: 2px; overflow-y: auto; }
    .sidebar-btn { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius); font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; background: none; border: none; width: 100%; text-align: left; transition: all var(--transition); }
    .sidebar-btn:hover, .sidebar-btn.active { background: var(--surface-2); color: var(--text); }
    .sidebar-btn svg { flex-shrink: 0; }
    .sidebar-divider { height: 1px; background: var(--border); margin: 8px 4px; }
    .sidebar-label { font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 4px 12px; letter-spacing: 0.05em; text-transform: uppercase; }
    .storage-bar-wrap { margin-top: auto; padding: 12px; }
    .storage-text { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
    .storage-bar { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .storage-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s ease; }

    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .toolbar { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .breadcrumb { display: flex; align-items: center; gap: 4px; flex: 1; font-size: 13px; overflow: hidden; }
    .breadcrumb-item { color: var(--text-muted); cursor: pointer; white-space: nowrap; }
    .breadcrumb-item:hover { color: var(--text); }
    .breadcrumb-item.current { color: var(--text); font-weight: 500; }
    .breadcrumb-sep { color: var(--text-muted); }
    .toolbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .content-area { flex: 1; overflow-y: auto; padding: 20px; }
    .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .files-list { display: flex; flex-direction: column; gap: 2px; }
    .file-card {
      border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 12px 12px;
      cursor: pointer; transition: all var(--transition); background: var(--surface); position: relative; user-select: none;
    }
    .file-card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
    .file-card.selected { border-color: var(--accent); background: var(--surface-2); }
    .file-icon { font-size: 36px; margin-bottom: 10px; display: block; text-align: center; }
    .file-name { font-size: 12px; font-weight: 500; text-align: center; color: var(--text); word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .file-meta { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 4px; }
    .file-shared-badge { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; background: var(--blue); border-radius: 99px; }

    .file-row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: var(--radius); cursor: pointer; transition: background var(--transition); }
    .file-row:hover { background: var(--surface-2); }
    .file-row.selected { background: var(--surface-2); }
    .file-row-icon { font-size: 20px; flex-shrink: 0; width: 28px; text-align: center; }
    .file-row-name { flex: 1; font-size: 13px; font-weight: 500; min-width: 0; }
    .file-row-meta { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .file-row-actions { display: flex; gap: 4px; opacity: 0; transition: opacity var(--transition); }
    .file-row:hover .file-row-actions { opacity: 1; }

    .drop-zone { border: 2px dashed var(--border); border-radius: var(--radius-lg); padding: 48px; text-align: center; color: var(--text-muted); transition: all var(--transition); }
    .drop-zone.dragging { border-color: var(--accent); background: var(--surface-2); color: var(--text); }
    .drop-zone svg { margin-bottom: 12px; opacity: 0.5; }

    #upload-progress-wrap { position: fixed; bottom: 24px; left: 24px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
    .upload-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; min-width: 260px; box-shadow: var(--shadow-md); }
    .upload-item-name { font-size: 12px; font-weight: 500; margin-bottom: 6px; }
    .upload-bar { height: 3px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .upload-bar-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.2s; }

    .context-menu { position: fixed; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); z-index: 500; min-width: 180px; padding: 4px; }
    .context-menu.hidden { display: none; }
    .ctx-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 13px; border-radius: 5px; cursor: pointer; color: var(--text); transition: background var(--transition); }
    .ctx-item:hover { background: var(--surface-2); }
    .ctx-item.danger { color: var(--danger); }
    .ctx-item.danger:hover { background: var(--danger-light); }
    [data-theme="light"] .ctx-item.danger:hover { background: #fef2f2; }
    .ctx-sep { height: 1px; background: var(--border); margin: 4px 0; }

    .preview-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .preview-overlay.hidden { display: none; }
    .preview-header { display: flex; align-items: center; width: 100%; max-width: 900px; gap: 12px; margin-bottom: 16px; }
    .preview-title { flex: 1; font-size: 14px; font-weight: 500; color: #fff; min-width: 0; }
    .preview-body { width: 100%; max-width: 900px; max-height: calc(100vh - 140px); display: flex; align-items: center; justify-content: center; }
    .preview-body img { max-width: 100%; max-height: calc(100vh - 140px); border-radius: var(--radius); object-fit: contain; }
    .preview-body video, .preview-body audio { width: 100%; max-width: 900px; border-radius: var(--radius); background: #000; }
    .preview-body audio { max-width: 480px; }
    .preview-body iframe { width: 100%; height: calc(100vh - 140px); border: none; border-radius: var(--radius); background: #fff; }
    .preview-body pre { background: var(--surface); padding: 20px; border-radius: var(--radius); width: 100%; overflow: auto; max-height: calc(100vh - 140px); font-size: 13px; line-height: 1.6; }
    .preview-unsupported { color: #aaa; text-align: center; }
    .preview-unsupported svg { margin-bottom: 12px; opacity: 0.4; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 320px; color: var(--text-muted); text-align: center; gap: 8px; }
    .empty-state svg { opacity: 0.3; margin-bottom: 4px; }
    .search-results-label { font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 16px; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">
      <img src="/logo.png" alt="Logo" style="height: 24px; border-radius: 4px;" onerror="this.style.display='none'" />
      <span>7ostera Drive</span>
    </div>
    <div class="topbar-search">
      <svg class="topbar-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" type="text" placeholder="Search files…" autocomplete="off" />
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm btn-icon" id="theme-toggle" title="Toggle dark mode">
        <svg id="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="icon-moon" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="avatar" id="user-avatar" title="Account Settings" data-action="open-profile">?</div>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Sign out</button>
    </div>
  </div>

  <div class="layout">

    <aside class="sidebar">
      <button class="btn btn-primary btn-sm" id="upload-btn" style="width:100%;justify-content:center;margin-bottom:8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Upload
      </button>
      <input type="file" id="file-input" multiple class="hidden" />

      <button class="sidebar-btn active" id="nav-my-drive" data-action="nav-root">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        My Drive
      </button>
      <button class="sidebar-btn" id="nav-shared" data-action="nav-shared">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        Shared by me
      </button>

      <div class="sidebar-divider"></div>

      <button class="sidebar-btn" data-action="new-folder">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
        New Folder
      </button>

      <div class="storage-bar-wrap">
        <div class="storage-text" id="storage-text">Loading…</div>
        <div class="storage-bar"><div class="storage-fill" id="storage-fill" style="width:0%"></div></div>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="breadcrumb" id="breadcrumb">
          <span class="breadcrumb-item current" data-action="nav-root">My Drive</span>
        </div>
        <div class="toolbar-right">
          <select class="input" id="sort-select" style="padding:4px 24px 4px 8px; font-size:12px; height:auto; border-radius:var(--radius); margin-right:8px;">
            <option value="name_asc">Name (A-Z)</option>
            <option value="name_desc">Name (Z-A)</option>
            <option value="date_desc">Newest</option>
            <option value="date_asc">Oldest</option>
            <option value="size_desc">Largest</option>
            <option value="size_asc">Smallest</option>
          </select>
          <button class="btn btn-ghost btn-sm btn-icon" id="view-grid" title="Grid view" data-action="set-view-grid">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          </button>
          <button class="btn btn-ghost btn-sm btn-icon" id="view-list" title="List view" data-action="set-view-list">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="content-area" id="content-area"></div>
    </main>
  </div>

  <div id="upload-progress-wrap"></div>

  <div class="context-menu hidden" id="context-menu">
    <div class="ctx-item" id="ctx-open"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Open / Preview</div>
    <div class="ctx-item" id="ctx-download"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download</div>
    <div class="ctx-item" id="ctx-share"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> <span id="ctx-share-label">Share link</span></div>
    <div class="ctx-item" id="ctx-rename"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Rename</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item danger" id="ctx-delete"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg> Delete</div>
  </div>

  <div class="modal-overlay hidden" id="folder-modal">
    <div class="modal">
      <div class="modal-title">New Folder</div>
      <input class="input" id="folder-name-input" placeholder="Folder name" />
      <div class="modal-footer">
        <button class="btn btn-secondary" data-action="close-folder-modal">Cancel</button>
        <button class="btn btn-primary" data-action="create-folder">Create</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="rename-modal">
    <div class="modal">
      <div class="modal-title">Rename</div>
      <input class="input" id="rename-input" placeholder="New name" />
      <div class="modal-footer">
        <button class="btn btn-secondary" data-action="close-rename-modal">Cancel</button>
        <button class="btn btn-primary" data-action="save-rename">Save</button>
      </div>
    </div>
  </div>

  <div class="preview-overlay hidden" id="preview-overlay">
    <div class="preview-header">
      <div class="preview-title" id="preview-title"></div>
      <a class="btn btn-secondary btn-sm" id="preview-download-btn" download>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </a>
      <button class="btn btn-ghost btn-sm btn-icon" style="color:#fff;" data-action="close-preview">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="preview-body" id="preview-body"></div>
  </div>

  <div class="modal-overlay hidden" id="profile-modal">
    <div class="modal">
      <div class="modal-title">Profile Settings</div>
      <div style="margin-bottom:12px;">
        <label style="font-size:12px;font-weight:600;margin-bottom:4px;display:block;">Name</label>
        <input class="input" id="profile-name-input" placeholder="Your name" />
      </div>
      <div style="margin-bottom:12px;">
        <label style="font-size:12px;font-weight:600;margin-bottom:4px;display:block;">Email</label>
        <input class="input" type="email" id="profile-email-input" placeholder="you@example.com" />
      </div>
      <div style="margin-bottom:12px;">
        <label style="font-size:12px;font-weight:600;margin-bottom:4px;display:block;">Old Password (required if changing password)</label>
        <input class="input" type="password" id="profile-old-password-input" placeholder="Current password" />
      </div>
      <div style="margin-bottom:20px;">
        <label style="font-size:12px;font-weight:600;margin-bottom:4px;display:block;">New Password (optional)</label>
        <input class="input" type="password" id="profile-password-input" placeholder="Leave blank to keep current" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-action="close-profile">Cancel</button>
        <button class="btn btn-primary" data-action="save-profile">Save Changes</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/drive.js"></script>
</body>
</html>
